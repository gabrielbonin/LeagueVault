  </g>
  <path d="M768 436 H806 L790 480 H756 Z" fill="#d6fff0" opacity=".65" transform="translate(790 640) scale(.8) translate(-790 -470)"/>

  <!-- braco e mao segurando -->
  <g stroke="#160c06" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <path d="M560 1004 C590 910 640 850 720 806 L800 880 C760 920 730 960 716 1004 Z" fill="url(#fur)"/>
    <path d="M655 790 C680 745 815 745 850 790 C880 830 850 880 790 892 C720 905 640 860 655 790 Z" fill="url(#skin)"/>
    <path d="M700 760 C690 720 720 700 740 730 L748 776" fill="url(#skin)"/>
