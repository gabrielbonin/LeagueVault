<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d4a"/>
      <stop offset="1" stop-color="#051420"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset=".5" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#785a28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#5c3a20"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c896"/>
      <stop offset="1" stop-color="#d49c68"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2ee6a0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2ee6a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="190" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="190" fill="none" stroke="url(#frame)" stroke-width="28"/>

  <g stroke="#160c06" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
