    <path d="M734 345 H846 L915 414 V526 L846 595 H734 L665 526 V414 Z" fill="url(#gold)"/>
  </g>

  <!-- esmeralda no cabo da chave -->
  <g stroke="#06291f" stroke-width="10" stroke-linejoin="round">
