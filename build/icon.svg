    <path d="M150 1000 C160 800 270 730 400 730 C530 730 640 800 655 1000 Z" fill="#14252e" transform="translate(-20 -12)"/>
    <path d="M300 748 C340 800 440 800 490 748" fill="none" stroke="#c8aa6e" stroke-width="20"/>

    <!-- orelhas -->
    <circle cx="165" cy="420" r="92" fill="url(#fur)"/>
    <circle cx="165" cy="420" r="50" fill="#d49c68"/>
    <circle cx="625" cy="420" r="92" fill="url(#fur)"/>
    <circle cx="625" cy="420" r="50" fill="#d49c68"/>

    <!-- cabeca -->
    <path d="M395 130 C570 130 655 260 650 420 C646 600 560 750 395 750 C230 750 144 600 140 420 C135 260 220 130 395 130 Z" fill="url(#fur)"/>
    <path d="M395 150 l-26 -62 M395 150 l26 -56" fill="none" stroke-width="20"/>

    <!-- rosto -->
    <path d="M395 290 C440 245 570 250 578 370 C584 450 540 480 545 540 C552 650 480 716 395 716 C310 716 238 650 245 540 C250 480 206 450 212 370 C220 250 350 245 395 290 Z" fill="url(#skin)"/>

    <!-- olhos entediados -->
    <ellipse cx="300" cy="400" rx="66" ry="58" fill="#fbf6ea"/>
    <ellipse cx="490" cy="400" rx="66" ry="58" fill="#fbf6ea"/>
    <circle cx="316" cy="414" r="27" fill="#0b5c44" stroke="none"/>
    <circle cx="506" cy="414" r="27" fill="#0b5c44" stroke="none"/>
    <circle cx="316" cy="414" r="13" fill="#0b0b0b" stroke="none"/>
    <circle cx="506" cy="414" r="13" fill="#0b0b0b" stroke="none"/>
    <path d="M226 396 C232 332 368 332 374 396 Z" fill="#c98f5c"/>
    <path d="M416 396 C422 332 558 332 564 396 Z" fill="#c98f5c"/>

    <!-- focinho -->
    <path d="M380 510 q-10 16 -28 14 M410 510 q10 16 28 14" fill="none" stroke-width="12"/>
    <path d="M270 620 C330 650 430 660 530 590" fill="none"/>
    <path d="M530 590 q16 -4 18 -24" fill="none"/>
  </g>

  <!-- brilho da esmeralda -->
  <circle cx="790" cy="640" r="220" fill="url(#glow)"/>

  <g transform="translate(790 640) scale(.8 -.8) translate(-790 -470)">
